name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, windows-2022]
        node-version: [lts/*, latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
